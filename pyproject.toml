[project]
name = "spend-tracker"
version = "0.1.0"
description = "A simple FastAPI expense tracking app with login/register and a dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlmodel==0.0.22",
    "pydantic==2.10.4",
    "jinja2==3.1.5",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.20",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[tool.black]
line-length = 100
target-version = ["py310"]
