<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 340" role="img" aria-label="Flow diagram: Spec leads to a Review gate, which either sends work back to Spec for revision or forward to Design. Design leads to a second Review gate, which either sends work back to Design or forward to Tasks. Tasks leads to Build, then Validate, which either sends work back to Build on issues found, or forward to Ship on passing.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#5b6070" />
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#a15a17" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1760" height="340" fill="#ffffff" />

  <!-- backward loops (revise / issues found) -->
  <g fill="none" stroke="#a15a17" stroke-width="2" stroke-dasharray="6 5">
    <path d="M 345 170 C 345 60, 120 60, 120 170" marker-end="url(#arrow-gate)" />
    <path d="M 795 170 C 795 60, 570 60, 570 170" marker-end="url(#arrow-gate)" />
    <path d="M 1470 170 C 1470 60, 1245 60, 1245 170" marker-end="url(#arrow-gate)" />
  </g>
  <g font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="12" fill="#a15a17" text-anchor="middle">
    <text x="232" y="52">revise</text>
    <text x="682" y="52">revise</text>
    <text x="1357" y="52">issues found</text>
  </g>

  <!-- forward connectors -->
  <g stroke="#5b6070" stroke-width="2" marker-end="url(#arrow)">
    <line x1="200" y1="220" x2="278" y2="220" />
    <line x1="412" y1="220" x2="488" y2="220" />
    <line x1="650" y1="220" x2="728" y2="220" />
    <line x1="862" y1="220" x2="938" y2="220" />
    <line x1="1100" y1="220" x2="1163" y2="220" />
    <line x1="1325" y1="220" x2="1388" y2="220" />
    <line x1="1550" y1="220" x2="1598" y2="220" />
  </g>
  <g font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="450" y="207" fill="#4f46e5">approved</text>
    <text x="900" y="207" fill="#4f46e5">approved</text>
    <text x="1574" y="207" fill="#146c3f">passes</text>
  </g>

  <!-- stage nodes -->
  <g font-family="Manrope, system-ui, sans-serif">
    <!-- Spec -->
    <rect x="40" y="170" width="160" height="100" rx="12" fill="#eceafc" stroke="#4f46e5" stroke-width="1.5" />
    <text x="120" y="213" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-weight="700" font-size="14" letter-spacing="1" fill="#4f46e5">SPEC</text>
    <text x="120" y="236" text-anchor="middle" font-size="11.5" fill="#5b6070">define scope</text>

    <!-- Review 1 (diamond) -->
    <polygon points="280,220 345,170 410,220 345,270" fill="#fbf0e2" stroke="#a15a17" stroke-width="1.5" />
    <text x="345" y="216" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-weight="700" font-size="12.5" letter-spacing="0.5" fill="#a15a17">REVIEW</text>
    <text x="345" y="232" text-anchor="middle" font-size="10.5" fill="#5b6070">gate</text>

    <!-- Design -->
    <rect x="490" y="170" width="160" height="100" rx="12" fill="#eceafc" stroke="#4f46e5" stroke-width="1.5" />
    <text x="570" y="213" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-weight="700" font-size="14" letter-spacing="1" fill="#4f46e5">DESIGN</text>
    <text x="570" y="236" text-anchor="middle" font-size="11.5" fill="#5b6070">plan approach</text>

    <!-- Review 2 (diamond) -->
    <polygon points="730,220 795,170 860,220 795,270" fill="#fbf0e2" stroke="#a15a17" stroke-width="1.5" />
    <text x="795" y="216" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-weight="700" font-size="12.5" letter-spacing="0.5" fill="#a15a17">REVIEW</text>
    <text x="795" y="232" text-anchor="middle" font-size="10.5" fill="#5b6070">gate</text>

    <!-- Tasks -->
    <rect x="940" y="170" width="160" height="100" rx="12" fill="#eceafc" stroke="#4f46e5" stroke-width="1.5" />
    <text x="1020" y="213" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-weight="700" font-size="14" letter-spacing="1" fill="#4f46e5">TASKS</text>
    <text x="1020" y="236" text-anchor="middle" font-size="11.5" fill="#5b6070">break down</text>

    <!-- Build -->
    <rect x="1165" y="170" width="160" height="100" rx="12" fill="#eceafc" stroke="#4f46e5" stroke-width="1.5" />
    <text x="1245" y="213" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-weight="700" font-size="14" letter-spacing="1" fill="#4f46e5">BUILD</text>
    <text x="1245" y="236" text-anchor="middle" font-size="11.5" fill="#5b6070">implement</text>

    <!-- Validate -->
    <rect x="1390" y="170" width="160" height="100" rx="12" fill="#eceafc" stroke="#4f46e5" stroke-width="1.5" />
    <text x="1470" y="213" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-weight="700" font-size="14" letter-spacing="1" fill="#4f46e5">VALIDATE</text>
    <text x="1470" y="236" text-anchor="middle" font-size="11.5" fill="#5b6070">verify &amp; test</text>

    <!-- Ship -->
    <rect x="1600" y="185" width="120" height="70" rx="35" fill="#e4f3ea" stroke="#146c3f" stroke-width="1.5" />
    <text x="1660" y="226" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-weight="700" font-size="13" letter-spacing="1" fill="#146c3f">SHIP</text>
  </g>
</svg>
