<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - Spend Tracker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="hint">Create an account to start tracking your expenses.</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/register">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
        </div>
        <button class="primary" type="submit">Register</button>
      </form>

      <div class="switch-link">
        Already have an account? <a href="/login">Log In</a>
      </div>
    </div>
  </div>

  {% include "_footer.html" %}
</body>
</html>
